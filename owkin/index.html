<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Owkin H&amp;E / Grid Type Prediction</title>
  <link rel="stylesheet" href="styles.css?v=20260924-owkin-grid-4">
</head>
<body>
  <header class="app-header">
    <div>
      <p class="eyebrow">OWKIN · CAVG10673</p>
      <h1>Owkin SpaceRec comparison</h1>
    </div>
    <button class="button primary" id="exportButton" type="button">Export PNG</button>
  </header>

  <main>
    <section class="toolbar" aria-label="Comparison controls">
      <div class="control-group pair-group">
        <span class="control-label">Compare</span>
        <div class="segmented pair-segmented" role="group" aria-label="Image pair">
          <button class="segment active" type="button" data-pair="he-type" aria-pressed="true">H&amp;E / Grid type prediction</button>
          <button class="segment" type="button" data-pair="type-expression" aria-pressed="false">Grid type / Grid expression</button>
        </div>
      </div>

      <div class="control-group type-group" id="typeGroup" hidden>
        <span class="control-label">Type</span>
        <div class="segmented type-segmented" role="group" aria-label="Predicted grid type">
          <button class="segment" type="button" data-type="Cancer Epithelial">Cancer Epithelial</button>
          <button class="segment" type="button" data-type="Normal Epithelial">Normal Epithelial</button>
          <button class="segment" type="button" data-type="T cells">T cells</button>
          <button class="segment" type="button" data-type="B_Plasma">B / Plasma</button>
          <button class="segment" type="button" data-type="NK">NK</button>
          <button class="segment" type="button" data-type="Myeloid">Myeloid</button>
          <button class="segment" type="button" data-type="Dendritic">Dendritic</button>
          <button class="segment" type="button" data-type="Fibroblast_PVL">Fibroblast / PVL</button>
          <button class="segment" type="button" data-type="Endothelial">Endothelial</button>
        </div>
      </div>

      <div class="control-group marker-group" id="markerGroup" hidden>
        <span class="control-label">Marker</span>
        <div class="segmented marker-segmented" id="markerButtons" role="group" aria-label="Marker gene"></div>
      </div>

      <div class="control-group mode-group">
        <span class="control-label">View</span>
        <div class="segmented" role="group" aria-label="Comparison mode">
          <button class="segment active" type="button" data-mode="compare" aria-pressed="true">Swipe + opacity</button>
          <button class="segment" type="button" data-mode="side" aria-pressed="false">Side by side</button>
        </div>
      </div>

      <div class="control-group range-group" id="rangeGroup">
        <label class="control-label" id="rangeLabel" for="comparisonRange">Position</label>
        <input id="comparisonRange" type="range" min="0" max="100" value="33" step="1">
        <output id="rangeOutput" for="comparisonRange">33%</output>
      </div>

      <div class="control-group range-group" id="opacityGroup">
        <label class="control-label" id="opacityLabel" for="opacityRange">Grid type opacity</label>
        <input id="opacityRange" type="range" min="0" max="100" value="100" step="1">
        <output id="opacityOutput" for="opacityRange">100%</output>
      </div>

      <div class="control-group file-group" id="fileGroup">
        <span class="control-label">Images</span>
        <label class="button file-button" for="heUpload">Choose H&amp;E</label>
        <input id="heUpload" type="file" accept="image/*">
        <label class="button file-button" for="predictionUpload">Choose prediction</label>
        <input id="predictionUpload" type="file" accept="image/*">
      </div>

      <button class="button" id="resetButton" type="button">Reset</button>
    </section>

    <div class="status-row">
      <p id="imageStatus" aria-live="polite">H&amp;E 3000×3000 · Grid type prediction 3000×3000</p>
      <p class="warning" id="imageWarning" role="alert" hidden></p>
    </div>

    <section class="viewer-wrap" aria-label="Image comparison">
      <div class="comparison-stage mode-compare" id="comparisonStage">
        <div class="single-view" id="singleView">
          <img class="image-layer base-layer" id="rightImage" src="assets/he.png?v=20260924-owkin-grid-1" alt="H&amp;E histology" draggable="false">
          <div class="image-layer clipped-layer" id="comparisonClip">
            <img id="leftImage" src="assets/grid_type.png?v=20260924-owkin-grid-3" alt="Grid type prediction" draggable="false">
          </div>
          <div class="divider" id="divider" role="slider" tabindex="0" aria-label="H&amp;E reveal position" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50">
            <span class="divider-line"></span>
            <span class="divider-handle" aria-hidden="true"><span>‹</span><span>›</span></span>
          </div>
        </div>

        <div class="side-view" id="sideView" hidden>
          <figure>
            <div class="side-image"><img id="sideLeftImage" src="assets/he.png?v=20260924-owkin-grid-1" alt="H&amp;E histology" draggable="false"></div>
            <figcaption id="sideLeftCaption">H&amp;E</figcaption>
          </figure>
          <figure>
            <div class="side-image"><img id="sideRightImage" src="assets/grid_type.png?v=20260924-owkin-grid-3" alt="Grid type prediction" draggable="false"></div>
            <figcaption id="sideRightCaption">Grid type prediction</figcaption>
          </figure>
        </div>
      </div>
    </section>

    <section class="legend-band" id="legendBand" aria-label="Color legend"></section>

    <section class="caption-band">
      <label for="captionInput">Sample ID or description</label>
      <input id="captionInput" type="text" value="CAVG10673 · Owkin Visium · SpaceRec Stage 1/2 · 3 px grid" maxlength="180">
    </section>
  </main>

  <script src="app.js?v=20260924-owkin-grid-4"></script>
</body>
</html>
